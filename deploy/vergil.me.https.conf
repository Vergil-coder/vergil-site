server {
    listen 80;
    server_name vergil.me;
    return 301 https://vergil.me$request_uri;
}
server {
    listen 443 ssl;
    server_name vergil.me;
    root /var/www/vergil;
    index index.html;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/vergil.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vergil.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    add_header X-Content-Type-Options nosniff always;
}
