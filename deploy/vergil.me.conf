server {
    listen 80;
    server_name vergil.me;
    root /var/www/vergil;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    add_header X-Content-Type-Options nosniff always;
}
